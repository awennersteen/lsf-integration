services:
  # Ephemeral key generator service that provisions the shared SSH and home volumes
  ssh-generator:
    image: alpine:latest
    container_name: lsf_ssh_init
    command: >
      sh -c "apk add --no-cache openssh-client &&
             # 1. Initialize Root SSH Keys
             if [ ! -f /shared_ssh/id_ed25519 ]; then
               ssh-keygen -t ed25519 -N '' -f /shared_ssh/id_ed25519 -C 'lsf-cluster-root-key' &&
               cp /shared_ssh/id_ed25519.pub /shared_ssh/authorized_keys &&
               chmod 700 /shared_ssh &&
               chmod 600 /shared_ssh/*;
             fi &&
             
             # 2. Initialize lsfadmin Shared Home & SSH (Fix ownership to UID/GID 1001)
             mkdir -p /lsfadmin_home/.ssh &&
             if [ ! -f /lsfadmin_home/.ssh/id_ed25519 ]; then
               ssh-keygen -t ed25519 -N '' -f /lsfadmin_home/.ssh/id_ed25519 -C 'lsfadmin-key' &&
               cp /lsfadmin_home/.ssh/id_ed25519.pub /lsfadmin_home/.ssh/authorized_keys;
             fi &&
             chown -R 1001:1001 /lsfadmin_home &&
             chmod 750 /lsfadmin_home &&
             chmod 700 /lsfadmin_home/.ssh &&
             chmod 600 /lsfadmin_home/.ssh/* &&

             # 3. Initialize lsfuser Shared Home & SSH (Fix ownership to UID/GID 1002)
             mkdir -p /lsfuser_home/.ssh &&
             if [ ! -f /lsfuser_home/.ssh/id_ed25519 ]; then
               ssh-keygen -t ed25519 -N '' -f /lsfuser_home/.ssh/id_ed25519 -C 'lsfuser-key' &&
               cp /lsfuser_home/.ssh/id_ed25519.pub /lsfuser_home/.ssh/authorized_keys;
             fi &&
             chown -R 1002:1002 /lsfuser_home &&
             chmod 750 /lsfuser_home &&
             chmod 700 /lsfuser_home/.ssh &&
             chmod 600 /lsfuser_home/.ssh/*"
    volumes:
      - ssh_keys:/shared_ssh
      - lsfadmin_home:/lsfadmin_home
      - lsfuser_home:/lsfuser_home

  lsf-head:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lsf-head
    hostname: lsf-head
    privileged: true
    ports:
      - "2222:22"
    environment:
      NODE_ROLE: head
      LSF_CLUSTER_NAME: cluster1
    depends_on:
      ssh-generator:
        condition: service_completed_successfully # Ensures keys and homes exist before starting
    volumes:
      - lsf_install:/opt/lsfce
      - shared_fs:/shared
      - ssh_keys:/root/.ssh:ro # Mounts keys read-only to root's home directory
      - lsfadmin_home:/home/lsfadmin
      - lsfuser_home:/home/lsfuser
    networks:
      lsfnet:
        ipv4_address: 10.10.10.10

  compute01:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compute01
    hostname: compute01
    privileged: true
    environment:
      NODE_ROLE: compute
      LSF_CLUSTER_NAME: cluster1
    depends_on:
      ssh-generator:
        condition: service_completed_successfully
      lsf-head:
        condition: service_started
    volumes:
      - lsf_install:/opt/lsfce
      - shared_fs:/shared
      - ssh_keys:/root/.ssh:ro
      - lsfadmin_home:/home/lsfadmin
      - lsfuser_home:/home/lsfuser
    networks:
      lsfnet:
        ipv4_address: 10.10.10.11

  compute02:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compute02
    hostname: compute02
    privileged: true
    environment:
      NODE_ROLE: compute
      LSF_CLUSTER_NAME: cluster1
    depends_on:
      ssh-generator:
        condition: service_completed_successfully
      lsf-head:
        condition: service_started
    volumes:
      - lsf_install:/opt/lsfce
      - shared_fs:/shared
      - ssh_keys:/root/.ssh:ro
      - lsfadmin_home:/home/lsfadmin
      - lsfuser_home:/home/lsfuser
    networks:
      lsfnet:
        ipv4_address: 10.10.10.12

  qsa_sim:
    build:
      context: ../simulated_quantum_resource
      dockerfile: Dockerfile
    container_name: qsa_sim
    env_file:
      - .env
    ports:
      - ${QSASIM_BIND_PORT}:${QSASIM_BIND_PORT}
    networks:
      lsfnet:
        ipv4_address: 10.10.10.13
    depends_on:
      createbuckets:
        condition: service_completed_successfully

  s3_proxy:
    image: alpine/socat
    container_name: s3_proxy
    network_mode: "service:qsa_sim"
    command: TCP-LISTEN:${S3_PORT:-9000},fork,reuseaddr TCP:rustfs:9000
    depends_on:
      - qsa_sim
      - rustfs

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    ports:
      - ${S3_PORT:-9000}:9000
      - ${S3_CONSOLE_PORT:-9001}:9001
    volumes:
      - rustfs_data:/data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  createbuckets:
    image: rustfs/rc:latest
    container_name: createbuckets
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/rc alias set s3 http://rustfs:9000 ${S3_ACCESS_KEY:-rustfsadmin} ${S3_SECRET_KEY:-rustfsadmin} --region ${S3_REGION:-us-east-1} --bucket-lookup path &&
      /usr/bin/rc bucket create s3/${S3_BUCKET_NAME:-mybucket} --ignore-existing &&
      /usr/bin/rc anonymous set public s3/${S3_BUCKET_NAME:-mybucket}
      "

volumes:
  lsf_install:
  shared_fs:
  ssh_keys:
  lsfadmin_home:  # Shared volume for lsfadmin
  lsfuser_home:   # Shared volume for lsfuser
  rustfs_data:

networks:
  lsfnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
